version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: loanwise-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-loanwise}
      MYSQL_USER: ${DB_USER:-loanwise_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-loanwise_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - loanwise-network

  # Python ML Service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: loanwise-ml
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - ALLOWED_ORIGINS=${FRONTEND_URL:-http://localhost:3000},${BACKEND_URL:-http://localhost:5000}
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - loanwise-network

  # Node.js Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loanwise-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-loanwise}
      - DB_USER=${DB_USER:-loanwise_user}
      - DB_PASSWORD=${DB_PASSWORD:-loanwise_pass}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production-to-a-secure-random-string}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - ML_SERVICE_URL=http://ml-service:8000
      - FRONTEND_URL=http://frontend:3000
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:5000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - loanwise-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loanwise-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - loanwise-network

volumes:
  mysql_data:
    driver: local

networks:
  loanwise-network:
    driver: bridge
